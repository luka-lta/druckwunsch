name: CI

# Prüft Pull Requests; Releases entstehen erst beim Merge auf main (siehe release.yml)
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
